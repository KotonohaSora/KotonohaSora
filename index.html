<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>言葉空</title>

    <!-- ページ全体の見た目を整えるCSS -->
    <style>
        body {
            font-family: "Noto Sans JP", sans-serif; /* 文字の種類 */
            background-color: #000096;           /* 背景色 */
            margin: 0;                           /* 余白をなくす */
            padding: 20px;                       /* 内側の余白 */
        }

        .header{
            width: 70%;
            margin: 0 auto;
            display: block;
        }

        .container {
            max-width: 800px;                    /* 横幅の最大値 */
            margin: 0 auto;                      /* 中央寄せ */
            background-color: #ffffff;           /* コンテンツ部分の背景色 */
            padding: 20px;                       /* コンテンツ内の余白 */
            border-radius: 8px;                  /* 角を少し丸くする */
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); /* 影をつける */
        }

        h1 {
            font-size: clamp(0.8rem, 1.7vw, 2.5rem);                     /* 見出しの文字サイズ */
            margin-bottom: 10px;                 /* 下の余白 */
        }

        .link-list {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            list-style: none;                    /* 箇条書きの点を消す */
            padding: 0;                          /* 内側の余白をゼロに */
        }

        .link-list li {
            margin: 10px 5%;
            max-width: 300px;
            width: 90%;
        }

        .link-list a {
            font-weight: bold;
            white-space: nowrap;
            text-align: center;
            font-size: clamp(0.5rem, 1.7vw, 1.6rem);

            display: block;                      /* 行全体をクリックできるようにする */
            padding: 20px;                  /* 内側の余白 */
            text-decoration: none;               /* 下線を消す */
            color: #333333;                      /* 文字色 */
            border-radius: 4px;                  /* 角を少し丸くする */
            background-color: #e6f1ff;           /* 通常時の背景色 */
            transition: background-color 0.2s;   /* ホバー時の色変化をなめらかに */
        }

        .link-list a:hover {
            background-color: #c0d9ff;           /* マウスを乗せたときの背景色 */
        }

        .profile-image{
            vertical-align: middle;
            content: "";
            display: inline-block;
            margin: auto;
            width: 20%;
        }

        .prpfile-text{
            vertical-align: middle;
            font-weight: bold;
            display: inline-block;
            width: 60%;
            font-family: "Noto Sans JP", sans-serif; 
            background-color: #ebebeb;
            padding: 20px;
            margin: 10px;
            display: inline-block;
            font-size: clamp(0.8rem, 1.7vw, 2.5rem);
        }

        .board{
            width: 100%;
            display: block;
            margin-top: 8px;
        }

        .pin{
            transform: translate(-50%, -100%);
            width: 20%;
            position: absolute;
        }

    </style>
</head>
<body>
    <img src="img/headerimage.png" class="header">

    <div class="container">

        <div style="position: relative;">
            <img src="img/board.png" class="board" >
            <img src="img/pin.png" class="pin" id="pin" >

            <script src="script.js"></script>
        </div>

        <img src="img/content.png" width="100%" style="margin-bottom: 40px;">

        <h1>
            -SNS
        </h1>

        <ul class="link-list">
            <li>
                <a href="https://x.com/KotonohaSora_" target="_blank">
                    <b>X</b>
                </a>
            </li>
            <li>
                <a href="https://www.instagram.com/kotonoha.sora/" target="_blank">
                    <b>Instagram</b>
                </a>
            </li>
        </ul>

        <h1>-Creation
        </h1>

        <ul class="link-list">
            <li>
                <a href="https://www.google.com" target="_blank">
                    <b>YouTube</b>
                </a>
            </li>
            <li>
                <a href="https://www.nicovideo.jp/my?ref=garage_menu" target="_blank">
                    <b>ニコニコ動画</b>
                </a>
            </li>
            <li>
                <a href="https://note.com/sora_kotonoha365" target="_blank">
                    note
                </a>
            </li>
            <li>
                <a href="https://mypage.syosetu.com/2449677/" target="_blank">
                    <b>小説家になろう</b>
                </a>
            </li>
        </ul>

        <h1>
            -Profile
        </h1>

        <img src="img/profile.png" alt="test" class="profile-image">
        
        <p class="prpfile-text">
            創るのが好きな人<br>
            毎週物を作ってあちこちに出している<br>
            今年の目標「作品を100個作る」
        </p>
    </div>
</body>
</html>
